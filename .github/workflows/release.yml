name: Voice Pipes release

# Push a tag like v0.2.0 to build the menu bar app for Apple silicon and publish it to the public releases repo:
# the installer DMG (also as Voice-Pipes.dmg, the stable "latest" download link), the zip Sparkle updates from,
# and the signed update feed (appcast.xml) that installed copies check every few minutes.
#
# Needs these repository secrets:
#   SPARKLE_ED_PRIVATE_KEY  the update signing key (Tools/make_update_key.swift); its public half is UPDATE_PUBLIC_KEY
#   RELEASES_TOKEN          a fine-grained token with Contents: read & write on the releases repo only
#   DEVID_CERT_P12          base64 of the "Developer ID Application: Aram Zadikian (7F3RGY9LG8)" certificate + key
#   DEVID_CERT_PASSWORD     (.p12) and its password. Signing every release with it keeps macOS permissions and
#                           Keychain access across updates.
#   NOTARY_KEY_P8           App Store Connect API key (the .p8 file's contents) with its NOTARY_KEY_ID and
#   NOTARY_KEY_ID           NOTARY_ISSUER_ID, for notarization.
#   NOTARY_ISSUER_ID
# (SIGNING_CERT_P12 / SIGNING_CERT_PASSWORD hold the old self-signed "Voice Tools Signing" certificate, used up to
# 0.9.1 and kept only as a backup.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no release is published for manual runs)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: read

env:
  RELEASES_REPO: brancusi/voice-tools-releases

jobs:
  build:
    runs-on: macos-15          # Apple silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [[ "$(cat VERSION)" == "${{ steps.v.outputs.version }}" ]] \
            || { echo "Tag v${{ steps.v.outputs.version }} doesn't match VERSION ($(cat VERSION))." >&2; exit 1; }

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Signing certificate
        env:
          P12: ${{ secrets.DEVID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEVID_CERT_PASSWORD }}
        run: |
          [[ -n "$P12" ]] || { echo "No signing certificate: building ad hoc."; exit 0; }
          kc="$RUNNER_TEMP/signing.keychain-db"; kc_pass="$(uuidgen)"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          [[ -n "$identity" ]] || { echo "No Developer ID Application identity in DEVID_CERT_P12" >&2; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Notarization key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          [[ -n "$NOTARY_KEY_P8" ]] || { echo "No notarization key: the build won't be notarized."; exit 0; }
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          [[ "$GITHUB_REF" == refs/tags/* ]] && export REQUIRE_UPDATES=1 REQUIRE_SIGNING=1 REQUIRE_NOTARIZATION=1
          VERSION="${{ steps.v.outputs.version }}" ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Voice-Pipes-${{ steps.v.outputs.version }}-arm64
          path: dist/*

      - name: Sign the update and write its feed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          v="${{ steps.v.outputs.version }}"
          zip="dist/Voice-Pipes-$v-arm64.zip"
          # A key that doesn't match the app's built-in public key would publish updates nobody can install.
          swiftc Tools/make_update_key.swift -o "$RUNNER_TEMP/make_update_key"
          [[ "$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/make_update_key" --public)" == "$(cat UPDATE_PUBLIC_KEY)" ]] \
            || { echo "SPARKLE_ED_PRIVATE_KEY doesn't match UPDATE_PUBLIC_KEY" >&2; exit 1; }
          signed=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | .cache/Sparkle-*/bin/sign_update --ed-key-file - "$zip")
          url="https://github.com/$RELEASES_REPO/releases/download/v$v/$(basename "$zip")"
          python3 Tools/appcast.py "$v" "$url" "$signed" RELEASE_NOTES.md > dist/appcast.xml

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          v="${{ steps.v.outputs.version }}"
          # A fixed-name copy of the DMG, so .../releases/latest/download/Voice-Pipes.dmg is always the newest.
          cp "dist/Voice-Pipes-$v.dmg" dist/Voice-Pipes.dmg
          gh release create "v$v" dist/Voice-Pipes-$v.dmg dist/Voice-Pipes-$v.dmg.sha256 dist/Voice-Pipes.dmg \
            dist/Voice-Pipes-$v-arm64.zip dist/Voice-Pipes-$v-arm64.zip.sha256 dist/appcast.xml \
            --repo "$RELEASES_REPO" --title "Voice Pipes $v" --notes-file RELEASE_NOTES.md
